# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
($username$hostname )\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$nodejs\
$deno\
$rust\
$golang\
$lua\
$zig\
$cmd_duration\
$line_break\
$character"""

add_newline = false
palette = "vesper"

[username]
style_user = "fg:blue"
style_root = "fg:red"
format = "[$user]($style)"
disabled = false
show_always = false
# Also shown when this is set (zsh/hosts/: on Macs with several accounts)
detect_env_vars = ["STARSHIP_USER_HOST"]

[hostname]
# user@host over ssh, and when zsh/hosts/ asks for it (still there after su -)
ssh_only = false
detect_env_vars = ["SSH_CONNECTION", "STARSHIP_USER_HOST"]
style = "fg:blue"
format = "[@$hostname]($style)"

[directory]
style = "fg:magenta"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "
truncation_symbol = "…/"

[git_branch]
style = "fg:cyan"
symbol = "⎇ "
# format = "[git:($branch)]($style)"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "fg:red"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
python_binary = [".venv/bin/python", "python"]
style = "fg:orange"
format = "[${symbol}(${version})(\\($virtualenv\\))]($style) "
detect_extensions = ["py", "ipynb"]
detect_files = ["uv.lock", "requirements.txt", "pyproject.toml", ".python-version", "Pipfile", "tox.ini", "setup.py", "__init__.py"]
detect_folders = [".venv"]

[nodejs]
style = "fg:green"
format = "[${symbol}(${version})]($style) "
symbol = "⬢ "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx"]
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[rust]
style = "fg:red"
format = "[${symbol}(${version})]($style) "
symbol = "🦀 "
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[golang]
style = "fg:teal"
format = "[${symbol}(${version})]($style) "
symbol = "🐹 "
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum", "glide.yaml", "Gopkg.yml", "Gopkg.lock", ".go-version"]
detect_folders = ["Godeps"]

[lua]
style = "fg:blue"
format = "[${symbol}(${version})]($style) "
symbol = "🌙 "
detect_extensions = ["lua"]
detect_files = [".lua-version"]
detect_folders = ["lua"]

[cmd_duration]
style = "fg:yellow"
format = "[took $duration]($style) "
min_time = 2000
show_milliseconds = false

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:cyan)"

[deno]
style = "fg:teal"

[zig]
style = "fg:orange"

[line_break]
disabled = false

[fill]
symbol = " "

[palettes.vesper]
accent = "#FFC799"      # Vesper yellow/accent
background = "#101010"  # Vesper background
foreground = "#FFFFFF"  # Vesper foreground
red = "#FF8080"         # Vesper red
green = "#A8E6CF"       # Vesper green (distinct from cyan)
yellow = "#FFC799"      # Vesper yellow
blue = "#87CEEB"        # Vesper blue (proper blue)
magenta = "#FF7300"     # Vesper magenta
cyan = "#7DD3FC"        # Vesper cyan (distinct from green)
white = "#FFFFFF"       # Vesper white
gray = "#505050"        # Vesper bright black

orange = "#FFAB70"      # Warmer orange variant
purple = "#C299FF"      # Soft purple (complementary to green)
teal = "#70D4CC"        # Teal variant of cyan
peach = "#FFD199"       # Softer yellow variant
coral = "#FF9999"       # Softer red variant
